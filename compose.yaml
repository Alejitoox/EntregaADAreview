services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complex_schedule
      POSTGRES_USER: complex_schedule
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complex_schedule -d complex_schedule"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
